<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My food menu</title>
    <style>
        body { 
            font-family: Arial;
            background: rgb(7, 85, 136);
            padding: 30px;
            text-align: center;
        
        }

        h1 { color: rgb(6, 52, 144)  }


        h1 + p { 
          background: blueviolet;
          padding: 10px 20px;
          border-radius: 8px;
          color:aquamarine;
          display: inline-block;
        }
    ul > li { 
        list-style: none;
        font-size: 18px;
        font-weight: bold;
        color: pink;
        padding: 10px 20px;
        margin: 6px auto;
        width: 260px;
        background: lavender;
        border-radius: 8px;
    }

    ul li :nth-child(3) { 
        background: aquamarine;
        color: violet;
    }

    .desc { 
        color: blue;
        margin-top: 20px;
        font-size: 14px;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
    }
    </style>
</head>
<body>
    <h1> My food menu</h1>
    <p>Pick your favourite dish and dig in</p>

    <ul>
        <li>Pizza</li>
        <li>Fries</li>
        <li>Tacos</li>
        <li>Ice cream</li>
    </ul>

    <p class="desc">Every spoon is made with love. Bon appetit!</p>

    <div class="links">
        <a bref="a">Order now</a>
        <a bref="a">See more</a>
    </div>
</body>
</html>
